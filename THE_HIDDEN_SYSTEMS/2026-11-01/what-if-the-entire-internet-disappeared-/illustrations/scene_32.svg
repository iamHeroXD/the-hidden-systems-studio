<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#151C28" />
    </linearGradient>
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Subtle Editorial Grid & Technical Guidelines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="8 8">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Scene Specific Vector Artwork with Hand-Drawn Linework -->
  <g filter="url(#sketch-filter)">

    <!-- Massive Server Blade Array -->
    <g fill="#0f172a" stroke="#E2E8F0" stroke-width="3">
      <rect x="400" y="240" width="1120" height="120" rx="8" />
      <rect x="400" y="380" width="1120" height="120" rx="8" />
      <rect x="400" y="520" width="1120" height="120" rx="8" />
      <rect x="400" y="660" width="1120" height="120" rx="8" />
    </g>
    
    <!-- Blinking Server LEDs -->
    <circle cx="460" cy="300" r="10" fill="#06B6D4" />
    <circle cx="500" cy="300" r="10" fill="#F59E0B" />
    <circle cx="460" cy="440" r="10" fill="#06B6D4" />
    <circle cx="500" cy="440" r="10" fill="#EF4444" />
    
    <!-- The Packet Surge Flow -->
    <path d="M 100 900 Q 960 400 1820 900" fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" opacity="0.7" />
    <text x="960" y="780" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-weight="bold" font-size="34">RETRY STORM: 100 BILLION QUEUED REQS</text>

  </g>

  <!-- UI Metadata Bar -->
  <rect x="40" y="40" width="380" height="48" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="60" y="72" fill="#F59E0B" font-family="monospace" font-weight="bold" font-size="18">SCENE 32 / 40</text>
  <text x="210" y="72" fill="#E2E8F0" font-family="sans-serif" font-size="16">ACT 7: CROSSFADE</text>
</svg>