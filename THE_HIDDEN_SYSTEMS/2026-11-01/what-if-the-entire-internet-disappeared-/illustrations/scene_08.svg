<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#151C28" />
    </linearGradient>
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Subtle Editorial Grid & Technical Guidelines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="8 8">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Scene Specific Vector Artwork with Hand-Drawn Linework -->
  <g filter="url(#sketch-filter)">

    <!-- Smartphone Frame -->
    <rect x="780" y="220" width="360" height="640" rx="36" fill="#1e293b" stroke="#E2E8F0" stroke-width="5" />
    <rect x="804" y="270" width="312" height="520" rx="12" fill="#0f172a" />
    <line x1="910" y1="245" x2="1010" y2="245" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    
    <!-- Frantic Cellular Wave Rings -->
    <circle cx="960" cy="530" r="90" fill="none" stroke="#EF4444" stroke-width="4" opacity="0.9" />
    <circle cx="960" cy="530" r="160" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="8 8" opacity="0.7" />
    <circle cx="960" cy="530" r="240" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.4" />
    
    <!-- Cell Tower Icon -->
    <path d="M 400 800 L 480 350 L 560 800 Z" fill="none" stroke="#E2E8F0" stroke-width="4" />
    <line x1="440" y1="500" x2="520" y2="500" stroke="#E2E8F0" stroke-width="3" />
    <line x1="420" y1="650" x2="540" y2="650" stroke="#E2E8F0" stroke-width="3" />
    
    <!-- Error Text -->
    <text x="960" y="540" text-anchor="middle" fill="#EF4444" font-family="sans-serif" font-weight="bold" font-size="32">NO SERVICE</text>
    <text x="960" y="585" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="18">IEEE 1588 PTP SYNC LOST</text>

  </g>

  <!-- UI Metadata Bar -->
  <rect x="40" y="40" width="380" height="48" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="60" y="72" fill="#F59E0B" font-family="monospace" font-weight="bold" font-size="18">SCENE 08 / 40</text>
  <text x="210" y="72" fill="#E2E8F0" font-family="sans-serif" font-size="16">ACT 2: SKETCH REVEAL WIPE</text>
</svg>