<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#151C28" />
    </linearGradient>
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Subtle Editorial Grid & Technical Guidelines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="8 8">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Scene Specific Vector Artwork with Hand-Drawn Linework -->
  <g filter="url(#sketch-filter)">

    <!-- Warehouse Shelving Matrix -->
    <g stroke="#E2E8F0" stroke-width="3" opacity="0.6">
      <line x1="200" y1="200" x2="200" y2="850" />
      <line x1="450" y1="200" x2="450" y2="850" />
      <line x1="200" y1="350" x2="450" y2="350" />
      <line x1="200" y1="520" x2="450" y2="520" />
      <line x1="200" y1="690" x2="450" y2="690" />
    </g>
    
    <!-- Frozen Automated Guided Vehicle (Robot) -->
    <rect x="800" y="680" width="320" height="140" rx="20" fill="#c2410c" stroke="#E2E8F0" stroke-width="4" />
    <circle cx="850" cy="820" r="30" fill="#0f172a" stroke="#E2E8F0" stroke-width="3" />
    <circle cx="1070" cy="820" r="30" fill="#0f172a" stroke="#E2E8F0" stroke-width="3" />
    <path d="M 960 620 L 960 680" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <circle cx="960" cy="610" r="16" fill="#EF4444" />
    
    <!-- Frozen Cargo Crane Arm -->
    <path d="M 1300 200 L 1750 350 L 1750 500" fill="none" stroke="#E2E8F0" stroke-width="6" />
    <line x1="1550" y1="280" x2="1550" y2="600" stroke="#F59E0B" stroke-width="4" stroke-dasharray="10 10" />
    <rect x="1460" y="600" width="180" height="100" fill="#0369a1" stroke="#E2E8F0" stroke-width="4" />
    <text x="1550" y="660" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20">MANIFEST UNKNOWN</text>

  </g>

  <!-- UI Metadata Bar -->
  <rect x="40" y="40" width="380" height="48" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="60" y="72" fill="#F59E0B" font-family="monospace" font-weight="bold" font-size="18">SCENE 17 / 40</text>
  <text x="210" y="72" fill="#E2E8F0" font-family="sans-serif" font-size="16">ACT 4: CROSSFADE</text>
</svg>