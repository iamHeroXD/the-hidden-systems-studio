<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#151C28" />
    </linearGradient>
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Subtle Editorial Grid & Technical Guidelines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="8 8">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Scene Specific Vector Artwork with Hand-Drawn Linework -->
  <g filter="url(#sketch-filter)">

    <!-- High Voltage Transmission Tower -->
    <path d="M 880 200 L 1040 200 L 1120 880 L 800 880 Z" fill="none" stroke="#E2E8F0" stroke-width="5" />
    <line x1="720" y1="360" x2="1200" y2="360" stroke="#E2E8F0" stroke-width="5" />
    <line x1="760" y1="520" x2="1160" y2="520" stroke="#E2E8F0" stroke-width="5" />
    
    <!-- Transformer Arc Spark -->
    <circle cx="960" cy="620" r="140" fill="#1e1b4b" stroke="#F59E0B" stroke-width="4" />
    <path d="M 960 520 L 980 580 L 940 620 L 990 710" fill="none" stroke="#EAB308" stroke-width="8" stroke-linecap="round" />
    
    <!-- SCADA Dial Gauge -->
    <circle cx="450" cy="600" r="100" fill="#0f172a" stroke="#E2E8F0" stroke-width="4" />
    <line x1="450" y1="600" x2="520" y2="540" stroke="#EF4444" stroke-width="6" stroke-linecap="round" />
    <text x="450" y="740" text-anchor="middle" fill="#EF4444" font-family="monospace" font-size="22">58.4 Hz [TRIP]</text>

  </g>

  <!-- UI Metadata Bar -->
  <rect x="40" y="40" width="380" height="48" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="60" y="72" fill="#F59E0B" font-family="monospace" font-weight="bold" font-size="18">SCENE 25 / 40</text>
  <text x="210" y="72" fill="#E2E8F0" font-family="sans-serif" font-size="16">ACT 5: SKETCH REVEAL WIPE</text>
</svg>