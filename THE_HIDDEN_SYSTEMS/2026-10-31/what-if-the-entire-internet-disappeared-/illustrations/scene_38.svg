<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#151C28" />
    </linearGradient>
    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Subtle Editorial Grid & Technical Guidelines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="8 8">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Scene Specific Vector Artwork with Hand-Drawn Linework -->
  <g filter="url(#sketch-filter)">

    <!-- The Investigator Silhouette -->
    <g stroke="#E2E8F0" stroke-width="4" fill="none">
      <!-- Head and Trench Collar -->
      <circle cx="960" cy="380" r="60" fill="#1e293b" />
      <path d="M 880 480 Q 960 440 1040 480 L 1080 820 L 840 820 Z" fill="#0f172a" />
      <!-- Hands cradling glowing strand -->
      <path d="M 860 620 Q 960 660 1060 620" stroke-width="6" stroke-linecap="round" />
    </g>
    
    <!-- Single Glowing Filament -->
    <line x1="400" y1="620" x2="1520" y2="620" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <line x1="880" y1="620" x2="1040" y2="620" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <circle cx="960" cy="620" r="28" fill="url(#laser-glow)" />
    
    <!-- Documentary Sign-off -->
    <text x="960" y="900" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-weight="bold" font-size="36" letter-spacing="6">THE HIDDEN SYSTEMS</text>
    <text x="960" y="945" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="20">THE INVISIBLE MACHINE OF CIVILIZATION</text>

  </g>

  <!-- UI Metadata Bar -->
  <rect x="40" y="40" width="380" height="48" rx="8" fill="#0f172a" opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="60" y="72" fill="#F59E0B" font-family="monospace" font-weight="bold" font-size="18">SCENE 38 / 40</text>
  <text x="210" y="72" fill="#E2E8F0" font-family="sans-serif" font-size="16">ACT 8: SKETCH REVEAL WIPE</text>
</svg>