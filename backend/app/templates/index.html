<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HIDDEN SYSTEMS | STUDIO ENGINE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            black: '#000000',
            surface: {
              950: '#060608',
              900: '#0C0C10',
              850: '#14141A',
              800: '#1C1C24',
              700: '#282834',
              600: '#3A3A4A'
            },
            crimson: {
              DEFAULT: '#EF4444',
              glow: '#FF2A4A',
              dark: '#991B1B'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
    }
    
    .glow-red {
      box-shadow: 0 0 25px -2px rgba(239, 68, 68, 0.45);
    }
    .glow-red-lg {
      box-shadow: 0 0 45px 0px rgba(255, 42, 74, 0.55);
    }
    .border-glow {
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .border-glow:hover {
      border-color: #EF4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
    }

    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #060608; }
    ::-webkit-scrollbar-thumb { background: #282834; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #EF4444; }

    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    .eq-1 { animation: eqBar 0.7s ease-in-out infinite; }
    .eq-2 { animation: eqBar 0.4s ease-in-out infinite 0.15s; }
    .eq-3 { animation: eqBar 0.9s ease-in-out infinite 0.3s; }
    .eq-4 { animation: eqBar 0.6s ease-in-out infinite 0.05s; }
  </style>
</head>
<body class="h-screen flex flex-col bg-black text-white selection:bg-crimson selection:text-white overflow-hidden bg-grid">

  <!-- ================= TOP HUD HEADER ================= -->
  <header class="h-16 bg-surface-950/90 backdrop-blur-md border-b border-surface-800 px-6 flex items-center justify-between shrink-0 z-30">
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-red-600 flex items-center justify-center font-black text-black text-sm glow-red tracking-tighter">
        HS
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xs font-black tracking-widest text-white uppercase font-mono">THE HIDDEN SYSTEMS</h1>
          <span class="px-1.5 py-0.5 rounded text-[9px] font-mono font-bold bg-red-600/20 text-crimson border border-red-600/40">
            PRO STUDIO
          </span>
        </div>
        <p class="text-[10px] text-zinc-500 font-mono">AUTONOMOUS 2D ANIMATED DOCUMENTARY PLATFORM</p>
      </div>
    </div>

    <!-- Live Status & Instant Trigger -->
    <div class="flex items-center gap-4">
      <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-surface-900 border border-surface-800 text-[11px] font-mono">
        <span class="w-2 h-2 rounded-full bg-crimson animate-ping" id="status-dot"></span>
        <span id="status-label" class="text-zinc-300 font-bold uppercase">STANDBY</span>
      </div>

      <button onclick="triggerProduction()" id="header-start-btn" class="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-mono font-black text-xs glow-red transition transform active:scale-95">
        <i data-lucide="zap" class="w-4 h-4 fill-white"></i>
        <span>START PRODUCTION</span>
      </button>
    </div>
  </header>

  <!-- ================= MAIN WORKSPACE ================= -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Navigation -->
    <aside class="w-56 bg-surface-950/80 backdrop-blur-md border-r border-surface-800 flex flex-col justify-between p-3 shrink-0">
      <div class="space-y-1 font-mono text-xs" id="nav-list">
        <button onclick="selectTab('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-white bg-surface-850 font-bold border-l-2 border-crimson transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-crimson"></i>
          <span>Dashboard</span>
        </button>
        <button onclick="selectTab('swarm')" id="nav-swarm" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-white hover:bg-surface-900 transition">
          <i data-lucide="cpu" class="w-4 h-4"></i>
          <span>AI Swarm (8)</span>
        </button>
        <button onclick="selectTab('video')" id="nav-video" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-white hover:bg-surface-900 transition">
          <i data-lucide="play-circle" class="w-4 h-4"></i>
          <span>Video Master</span>
        </button>
        <button onclick="selectTab('storyboard')" id="nav-storyboard" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-white hover:bg-surface-900 transition">
          <i data-lucide="film" class="w-4 h-4"></i>
          <span>40 Scenes</span>
        </button>
        <button onclick="selectTab('topics')" id="nav-topics" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-white hover:bg-surface-900 transition">
          <i data-lucide="compass" class="w-4 h-4"></i>
          <span>Topic Radar</span>
        </button>
        <button onclick="selectTab('script')" id="nav-script" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-white hover:bg-surface-900 transition">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span>Script</span>
        </button>
      </div>

      <!-- Quick Owner Telemetry HUD -->
      <div class="p-3 bg-surface-900/60 rounded-xl border border-surface-800 text-[10px] font-mono space-y-1.5">
        <div class="text-zinc-500 uppercase tracking-wider font-bold">STUDIO TELEMETRY</div>
        <div class="flex justify-between text-zinc-400">
          <span>CPU:</span>
          <span id="stat-cpu" class="text-white font-bold">--%</span>
        </div>
        <div class="flex justify-between text-zinc-400">
          <span>RAM:</span>
          <span id="stat-ram" class="text-white font-bold">-- / -- GB</span>
        </div>
        <div class="flex justify-between text-zinc-400">
          <span>ENGINE:</span>
          <span class="text-crimson font-bold">1080P 30FPS</span>
        </div>
      </div>
    </aside>

    <!-- Main Viewport Stage -->
    <main class="flex-1 overflow-y-auto p-6" id="viewport">
      <!-- Dynamic Injected Content -->
    </main>
  </div>

  <!-- Scene Inspection Lightbox Modal (Supports MP4 Video, PNG, SVG) -->
  <div id="modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-surface-950 border border-surface-700 rounded-2xl max-w-4xl w-full p-6 relative shadow-2xl space-y-4">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white p-1 rounded-lg bg-surface-800 border border-surface-700 z-10">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Minimalist Floating Toast -->
  <div id="toast" class="fixed bottom-6 right-6 px-4 py-2.5 rounded-lg bg-surface-900 border border-crimson text-xs font-mono text-white shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-crimson animate-ping"></span>
    <span id="toast-msg">Message</span>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    let currentTab = "overview";
    let modalMode = "video"; // "video", "frame", "vector"
    let selectedActFilter = 0; // 0 = all acts, 1..8
    let topicSearchTerm = "";
    let state = {
      prod: null,
      progress: null,
      topics: [],
      logs: [],
      telemetry: null,
      sceneIdx: 0,
      countdownTimer: null
    };

    const AI_AGENTS = [
      { id: "director", name: "ORCHESTRATOR AI", role: "Pipeline Director", icon: "activity", stageRange: [0, 1] },
      { id: "research", name: "RESEARCH AI", role: "Fact-Checked Dossier", icon: "search", stageRange: [1, 3] },
      { id: "writer", name: "SCRIPTWRITER AI", role: "5-Act Retention Narrative", icon: "pen-tool", stageRange: [3, 5] },
      { id: "illustrator", name: "ILLUSTRATION AI", role: "40 Vector 1080p Scenes", icon: "palette", stageRange: [5, 8] },
      { id: "animator", name: "ANIMATION AI", role: "1080p Camera Movement", icon: "video", stageRange: [8, 9] },
      { id: "voice", name: "NEURAL VOICE AI", role: "Edge-TTS Narration Master", icon: "mic", stageRange: [9, 10] },
      { id: "sound", name: "AUDIO & VIDEO MIXER", role: "EBU R128 -16 LUFS Normalizer", icon: "sliders", stageRange: [11, 14] },
      { id: "publisher", name: "YOUTUBE PUBLISHER AI", role: "Thumbnails & Release Package", icon: "package", stageRange: [14, 17] }
    ];

    function showToast(text) {
      const t = document.getElementById("toast");
      document.getElementById("toast-msg").textContent = text;
      t.style.opacity = "1";
      setTimeout(() => { t.style.opacity = "0"; }, 3200);
    }

    function formatTime(sec) {
      if (!sec || sec < 0) sec = 0;
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function selectTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll("#nav-list button").forEach(b => {
        b.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-white hover:bg-surface-900 transition";
      });
      const activeBtn = document.getElementById(`nav-${tabId}`);
      if (activeBtn) {
        activeBtn.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-white bg-surface-850 font-bold border-l-2 border-crimson transition";
      }
      renderView();
    }

    let lastRenderedStage = -1;
    let lastRenderedStatus = "";

    function onMasterVideoTimeUpdate(vid) {
      const t = vid.currentTime;
      const p = state.prod || {};
      const scenes = (p.data && p.data.scenes) || [];
      let accum = 0;
      let activeScene = null;
      let activeIdx = 0;
      for (let i = 0; i < scenes.length; i++) {
        const s = scenes[i];
        const dur = s.duration_sec || 18;
        if (t >= accum && t < accum + dur) {
          activeScene = s;
          activeIdx = i;
          break;
        }
        accum += dur;
      }
      const captionText = activeScene ? `"${activeScene.narration_chunk}"` : 'Playing master documentary...';
      const sceneLabel = activeScene ? `ACT 0${activeScene.act_number} // SCENE ${(activeIdx + 1).toString().padStart(2, '0')}:` : 'TELEMETRY:';
      
      const hudDashText = document.getElementById("dash-live-caption-text");
      const hudDashIdx = document.getElementById("dash-live-scene-idx");
      if (hudDashText) hudDashText.textContent = captionText;
      if (hudDashIdx) hudDashIdx.textContent = sceneLabel;

      const hudDeckText = document.getElementById("deck-live-caption-text");
      const hudDeckIdx = document.getElementById("deck-live-scene-idx");
      if (hudDeckText) hudDeckText.textContent = captionText;
      if (hudDeckIdx) hudDeckIdx.textContent = sceneLabel;

      // Active transcript scroller highlighting
      const activeRow = document.getElementById(`transcript-row-${activeIdx}`);
      if (activeRow && !activeRow.classList.contains("border-crimson")) {
        document.querySelectorAll(".transcript-row").forEach(r => {
          r.classList.remove("bg-surface-850", "border-crimson", "text-white");
          r.classList.add("text-zinc-400", "border-surface-800");
        });
        activeRow.classList.add("bg-surface-850", "border-crimson", "text-white");
        activeRow.classList.remove("text-zinc-400", "border-surface-800");
      }
    }

    async function pollProgress() {
      try {
        const res = await fetch("/api/progress");
        if (res.ok) {
          const prog = await res.json();
          state.progress = prog;
          updateStatus();

          const stageChanged = prog.stage_index !== lastRenderedStage;
          const statusChanged = prog.status !== lastRenderedStatus;

          if (stageChanged || statusChanged) {
            lastRenderedStage = prog.stage_index;
            lastRenderedStatus = prog.status;
            renderView();
          } else if (prog.status === "running") {
            updateLiveTelemetryHUD(prog);
          }
        }
      } catch (e) {
        console.error("Progress poll err:", e);
      }
    }

    function updateLiveTelemetryHUD(prog) {
      const countdown = document.getElementById("countdown-val");
      if (countdown) countdown.textContent = formatTime(prog.eta_sec || 0);

      const elapsed = document.getElementById("elapsed-val");
      if (elapsed) elapsed.textContent = formatTime(prog.elapsed_sec || 0);

      const pct = document.getElementById("progress-pct-val");
      if (pct) pct.textContent = `${prog.progress_pct || 0}%`;

      const bar = document.getElementById("progress-bar-fill");
      if (bar) bar.style.width = `${prog.progress_pct || 0}%`;

      const liveMsg = document.getElementById("micro-meter-msg");
      if (liveMsg && prog.live && prog.live.msg) {
        liveMsg.textContent = prog.live.msg;
      }

      const liveCount = document.getElementById("micro-meter-count");
      if (liveCount && prog.live && prog.live.total) {
        liveCount.textContent = `${prog.live.done || 0} / ${prog.live.total || 40} (${prog.live.pct || 0}%)`;
      }
    }

    async function pollFull() {
      try {
        const [prodRes, topRes, sysRes, logRes] = await Promise.all([
          fetch("/api/productions"),
          fetch("/api/topics"),
          fetch("/api/system/status"),
          fetch("/api/logs?limit=25")
        ]);

        if (prodRes.ok) {
          const prods = await prodRes.json();
          if (prods.length > 0) state.prod = prods[0];
        }
        if (topRes.ok) {
          const t = await topRes.json();
          state.topics = t.candidates || [];
        }
        if (sysRes.ok) {
          const s = await sysRes.json();
          state.telemetry = s.telemetry;
          if (state.telemetry) {
            document.getElementById("stat-cpu").textContent = `${state.telemetry.cpu_percent.toFixed(0)}%`;
            document.getElementById("stat-ram").textContent = `${state.telemetry.ram_used_gb} / ${state.telemetry.ram_total_gb} GB`;
          }
        }
        if (logRes.ok) state.logs = await logRes.json();

        updateStatus();
        renderView();
      } catch (e) {
        console.error("Full poll err:", e);
      }
    }

    function updateStatus() {
      const prog = state.progress;
      const label = document.getElementById("status-label");
      const dot = document.getElementById("status-dot");
      if (!prog) return;

      if (prog.status === "running") {
        label.textContent = `WORKING: STAGE ${prog.stage_index + 1}/18 (${prog.progress_pct}%)`;
        label.className = "text-crimson font-black animate-pulse";
        dot.className = "w-2 h-2 rounded-full bg-crimson animate-ping";
      } else if (prog.status === "awaiting_approval" || prog.status === "completed") {
        label.textContent = "COMPLETE - MASTER READY";
        label.className = "text-white font-bold";
        dot.className = "w-2 h-2 rounded-full bg-white";
      } else {
        label.textContent = "READY ON-DEMAND";
        label.className = "text-zinc-400 font-bold";
        dot.className = "w-2 h-2 rounded-full bg-zinc-600";
      }
    }

    async function triggerProduction() {
      selectTab('overview');
      const btn = document.getElementById("header-start-btn");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>STARTING...</span>`;
        lucide.createIcons();
      }
      showToast("Master Production Deployed! Parallel AI Agents Engaged.");
      try {
        await fetch("/api/automation/trigger-now", { method: "POST" });
        await pollProgress();
        await pollFull();
      } catch (err) {
        showToast("Error: " + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 fill-white"></i><span>START PRODUCTION</span>`;
          lucide.createIcons();
        }
      }
    }

    async function buildTopic(title) {
      selectTab('overview');
      showToast(`Building documentary: "${title}"`);
      await fetch("/api/topics/produce", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      await pollProgress();
      await pollFull();
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text);
      showToast(`Copied ${label} to clipboard!`);
    }

    function copyFullYouTubePackage() {
      const p = state.prod || {};
      const meta = (p.data && p.data.metadata) || {};
      const chaptersText = (meta.chapters || []).map(c => `${c.time} - ${c.title}`).join("\n");
      const pkg = `TITLE:\n${meta.final_title || p.topic_title}\n\nDESCRIPTION:\n${meta.description || ''}\n\nTAGS:\n${(meta.tags || []).join(', ')}\n\nPINNED COMMENT:\n${meta.pinned_comment || ''}`;
      navigator.clipboard.writeText(pkg);
      showToast("Entire YouTube Package (Title, Description, Chapters, Tags) Copied!");
    }

    async function openProjectFolder() {
      const p = state.prod || {};
      if (!p.id) return;
      try {
        const res = await fetch(`/api/productions/${p.id}/open-folder`, { method: "POST" });
        const data = await res.json();
        showToast(data.message || "Opened project folder in Explorer.");
      } catch (e) {
        showToast("Error opening folder: " + e.message);
      }
    }

    function setModalMode(mode) {
      modalMode = mode;
      renderModal();
      lucide.createIcons();
    }

    function openModal(idx) {
      state.sceneIdx = idx;
      modalMode = "video";
      renderModal();
      document.getElementById("modal").classList.remove("hidden");
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
    }

    function stepScene(delta) {
      const scenes = (state.prod && state.prod.data && state.prod.data.scenes) || [];
      const total = scenes.length || 40;
      state.sceneIdx = (state.sceneIdx + delta + total) % total;
      renderModal();
      lucide.createIcons();
    }

    function renderModal() {
      const p = state.prod || {};
      const scenes = (p.data && p.data.scenes) || [];
      const s = scenes[state.sceneIdx] || {};
      const scNum = (state.sceneIdx + 1).toString().padStart(2, "0");
      const content = document.getElementById("modal-content");

      const videoSrc = `/media/${p.date_folder}/${p.topic_slug}/animation/rendered_scenes/scene_${scNum}.mp4`;
      const pngSrc = `/media/${p.date_folder}/${p.topic_slug}/illustrations/scene_${scNum}.png`;
      const svgSrc = `/media/${p.date_folder}/${p.topic_slug}/illustrations/scene_${scNum}.svg`;

      content.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between pr-8">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded bg-red-600 text-white font-mono font-bold text-xs glow-red">
                SCENE ${scNum} / ${scenes.length || 40}
              </span>
              <span class="text-xs font-mono text-zinc-400">CAMERA MOVE: <span class="text-white font-bold">${s.camera_movement || 'Dynamic Pan'}</span></span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="stepScene(-1)" class="px-3 py-1 bg-surface-850 hover:bg-surface-800 text-xs font-mono rounded text-white border border-surface-700">PREV</button>
              <button onclick="stepScene(1)" class="px-3 py-1 bg-surface-850 hover:bg-surface-800 text-xs font-mono rounded text-white border border-surface-700">NEXT</button>
            </div>
          </div>

          <!-- Format Switcher Tabs -->
          <div class="flex items-center gap-2 border-b border-surface-800 pb-2">
            <button onclick="setModalMode('video')" class="px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition ${modalMode === 'video' ? 'bg-red-600 text-white glow-red' : 'bg-surface-900 text-zinc-400 hover:text-white'}">
              ▶ WATCH SCENE VIDEO (.MP4)
            </button>
            <button onclick="setModalMode('frame')" class="px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition ${modalMode === 'frame' ? 'bg-red-600 text-white glow-red' : 'bg-surface-900 text-zinc-400 hover:text-white'}">
              1080P MASTER FRAME (.PNG)
            </button>
            <button onclick="setModalMode('vector')" class="px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition ${modalMode === 'vector' ? 'bg-red-600 text-white glow-red' : 'bg-surface-900 text-zinc-400 hover:text-white'}">
              VECTOR SCHEMATIC (.SVG)
            </button>
          </div>

          <!-- Active Viewer Display -->
          <div class="bg-black rounded-xl overflow-hidden border border-surface-800 relative aspect-video flex items-center justify-center">
            ${modalMode === 'video' ? `
              <video controls autoplay class="w-full h-full object-contain" src="${videoSrc}"></video>
            ` : modalMode === 'frame' ? `
              <img src="${pngSrc}" class="w-full h-full object-cover" />
            ` : `
              <img src="${svgSrc}" class="w-full h-full object-contain p-4" />
            `}
          </div>

          <div class="bg-surface-950 p-4 rounded-xl border border-surface-800 text-xs space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="text-crimson font-mono font-bold block">NARRATION VOICE-OVER (${s.duration_sec || 18}s):</span>
              <span class="text-[10px] font-mono text-zinc-500">SOUND: ${s.sound_design || 'Atmospheric Drone'}</span>
            </div>
            <p class="text-zinc-200 text-sm leading-relaxed">"${s.narration_chunk || ''}"</p>
          </div>
        </div>
      `;
    }

    function renderView() {
      const v = document.getElementById("viewport");
      const p = state.prod || {};
      const prog = state.progress || {};
      const isRunning = prog.status === "running";
      const currentStageIdx = prog.stage_index !== undefined ? prog.stage_index : (p.current_stage_index || 0);
      const pData = p.data || {};
      const scenes = pData.scenes || [];
      const meta = pData.metadata || {};
      const thumbnails = pData.thumbnails || [];
      const script = pData.script || {};

                <video id="player" ontimeupdate="onMasterVideoTimeUpdate(this)" controls class="w-full h-full" src="/media/${p.date_folder}/${p.topic_slug}/video/preview_720p.mp4" poster="/media/${p.date_folder}/${p.topic_slug}/thumbnails/thumbnail_1.png">
                  <track id="deck-track" kind="subtitles" src="/media/${p.date_folder}/${p.topic_slug}/subtitles/captions.vtt" srclang="en" label="English" default>
                </video>
              </div>

              <!-- Live Synchronized Narration HUD Strip -->
              <div class="p-3 bg-surface-900 border border-surface-800 rounded-lg mb-3 flex items-center justify-between text-xs font-mono">
                <div class="flex items-center gap-2 overflow-hidden">
                  <span class="w-2 h-2 rounded-full bg-crimson animate-pulse shrink-0"></span>
                  <span id="deck-live-scene-idx" class="text-crimson font-bold shrink-0">ACT 01 // SCENE 01:</span>
                  <span id="deck-live-caption-text" class="text-white truncate font-sans">"Right now, roughly four billion pulses of light are rocketing through strands of glass..."</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <a href="/media/${p.date_folder}/${p.topic_slug}/subtitles/captions.vtt" download class="px-2 py-0.5 rounded bg-surface-850 hover:bg-surface-800 text-[10px] text-zinc-300">.VTT</a>
                  <a href="/media/${p.date_folder}/${p.topic_slug}/subtitles/captions.srt" download class="px-2 py-0.5 rounded bg-surface-850 hover:bg-surface-800 text-[10px] text-zinc-300">.SRT</a>
                </div>
              </div>

              <!-- Speed & PiP Controls -->
              <div class="flex items-center justify-between text-[11px] font-mono text-zinc-400 py-1.5 px-3 bg-surface-900 rounded-lg mb-3 border border-surface-800">
                <div class="flex items-center gap-2">
                  <span class="text-zinc-500">SPEED:</span>
                  <button onclick="document.getElementById('player').playbackRate = 1.0; showToast('Playback speed: 1.0x');" class="px-2 py-0.5 rounded bg-surface-800 hover:bg-surface-700 text-white font-bold">1.0x</button>
                  <button onclick="document.getElementById('player').playbackRate = 1.25; showToast('Playback speed: 1.25x');" class="px-2 py-0.5 rounded bg-surface-800 hover:bg-surface-700 text-white font-bold">1.25x</button>
                  <button onclick="document.getElementById('player').playbackRate = 1.5; showToast('Playback speed: 1.5x');" class="px-2 py-0.5 rounded bg-surface-800 hover:bg-surface-700 text-white font-bold">1.5x</button>
                  <button onclick="document.getElementById('player').playbackRate = 2.0; showToast('Playback speed: 2.0x');" class="px-2 py-0.5 rounded bg-surface-800 hover:bg-surface-700 text-white font-bold">2.0x</button>
                </div>
                <button onclick="document.getElementById('player').requestPictureInPicture().catch(() => showToast('PiP not available'));" class="px-2.5 py-0.5 rounded bg-surface-800 hover:bg-surface-700 text-white font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>POP-OUT PiP</span>
                </button>
              </div>

              <!-- Metadata 1-Click Copy Bar -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-3 border-t border-surface-800 text-xs font-mono">
                <button onclick="copyToClipboard('${(meta.final_title || p.topic_title || '').replace(/'/g, "\\'")}', 'Title')" class="p-3 bg-surface-900 hover:bg-surface-850 rounded-xl border border-surface-800 text-left">
                  <span class="text-zinc-500 block text-[10px]">YOUTUBE TITLE</span>
                  <span class="text-white font-bold block truncate mt-1">${meta.final_title || p.topic_title}</span>
                </button>
                <button onclick="copyFullYouTubePackage()" class="p-3 bg-surface-900 hover:bg-surface-850 rounded-xl border border-surface-800 text-left">
                  <span class="text-zinc-500 block text-[10px]">FULL YOUTUBE PACKAGE</span>
                  <span class="text-crimson font-bold block mt-1">CLICK TO COPY ALL (TITLE+DESC+TAGS)</span>
                </button>
                <button onclick="copyToClipboard('${(meta.tags || []).join(', ')}', 'SEO Tags')" class="p-3 bg-surface-900 hover:bg-surface-850 rounded-xl border border-surface-800 text-left">
                  <span class="text-zinc-500 block text-[10px]">SEO TAGS (COMMA SEPARATED)</span>
                  <span class="text-white font-bold block truncate mt-1">${(meta.tags || []).join(', ')}</span>
                </button>
              </div>
            </div>

            <!-- Audio Stems & Atmosphere Suite -->
            <div class="bg-surface-950 border border-surface-800 rounded-2xl p-4">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-mono font-bold text-white uppercase tracking-wider flex items-center gap-2">
                  <i data-lucide="volume-2" class="w-4 h-4 text-crimson"></i>
                  AUDIO STEMS & AMBIENT SCORE SUITE
                </span>
                <span class="text-[10px] font-mono text-zinc-500">BROADCAST QUALITY 192KBPS // -16 LUFS</span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono">
                <div class="p-3 rounded-xl bg-surface-900 border border-surface-800 space-y-2">
                  <div class="flex justify-between items-center">
                    <span class="text-white font-bold">1. MASTER VOICE-OVER TRACK</span>
                    <a href="/media/${p.date_folder}/${p.topic_slug}/audio/narration_full.mp3" download class="text-crimson text-[10px] hover:underline">DOWNLOAD MP3</a>
                  </div>
                  <audio controls class="w-full h-8" src="/media/${p.date_folder}/${p.topic_slug}/audio/narration_full.mp3"></audio>
                </div>
                <div class="p-3 rounded-xl bg-surface-900 border border-surface-800 space-y-2">
                  <div class="flex justify-between items-center">
                    <span class="text-white font-bold">2. 4-HARMONIC SUB-BASS SCORE</span>
                    <a href="/media/${p.date_folder}/${p.topic_slug}/video/ambient_score.mp3" download class="text-crimson text-[10px] hover:underline">DOWNLOAD MP3</a>
                  </div>
                  <audio controls class="w-full h-8" src="/media/${p.date_folder}/${p.topic_slug}/video/ambient_score.mp3"></audio>
                </div>
              </div>
            </div>

            <!-- 3 Thumbnails -->
            <div class="space-y-3">
              <span class="text-xs font-mono font-bold text-zinc-400 uppercase tracking-wider block">3 HIGH-CTR THUMBNAILS (1280x720)</span>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${thumbnails.map(t => `
                  <div class="bg-surface-950 border border-surface-800 rounded-xl overflow-hidden shadow-lg group">
                    <img src="/media/${p.date_folder}/${p.topic_slug}/thumbnails/thumbnail_${t.id}.png" class="w-full aspect-video object-cover group-hover:scale-105 transition" />
                    <div class="p-3 flex items-center justify-between">
                      <span class="text-xs font-mono text-white font-bold truncate">${t.title}</span>
                      <a href="/media/${p.date_folder}/${p.topic_slug}/thumbnails/thumbnail_${t.id}.png" download class="text-[10px] font-mono text-crimson hover:underline">DOWNLOAD</a>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>

            <!-- Interactive Synchronized Documentary Transcript Deck -->
            <div class="bg-surface-950 border border-surface-800 rounded-2xl p-5 space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="text-sm font-black text-white uppercase font-mono tracking-wider flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-crimson"></i>
                    SYNCHRONIZED DOCUMENTARY TRANSCRIPT
                  </h3>
                  <p class="text-[11px] text-zinc-400 font-mono mt-0.5">Click any scene timestamp to seek the video master instantly.</p>
                </div>
                <button onclick="copyToClipboard(scenes.map(s => s.narration_chunk).join('\\n\\n'), 'Full Script')" class="px-3 py-1.5 rounded bg-surface-900 hover:bg-surface-850 border border-surface-800 text-xs font-mono text-zinc-300 hover:text-white flex items-center gap-1.5 transition">
                  <i data-lucide="copy" class="w-3.5 h-3.5 text-crimson"></i>
                  <span>COPY TRANSCRIPT</span>
                </button>
              </div>

              <div class="space-y-2 max-h-96 overflow-y-auto pr-2">
                ${(() => {
                  let accumSec = 0;
                  return scenes.map((s, idx) => {
                    const thisSec = accumSec;
                    accumSec += (s.duration_sec || 18);
                    const timeStr = formatTime(thisSec);
                    return `
                      <div id="transcript-row-${idx}" onclick="document.getElementById('player').currentTime = ${thisSec}; document.getElementById('player').play();" class="transcript-row p-3 rounded-xl border border-surface-800 hover:border-crimson hover:bg-surface-900 cursor-pointer transition text-zinc-400 flex items-start gap-3">
                        <span class="text-xs font-mono font-bold text-crimson shrink-0 pt-0.5">${timeStr}</span>
                        <div class="flex-1">
                          <div class="flex items-center gap-2 mb-1">
                            <span class="px-1.5 py-0.2 rounded bg-surface-800 text-[9px] font-mono font-bold text-white uppercase">ACT ${s.act_number}</span>
                            <span class="text-[10px] font-mono text-zinc-500">SCENE ${(s.scene_id || idx + 1).toString().padStart(2, '0')} // ${s.camera_movement}</span>
                          </div>
                          <p class="text-xs leading-relaxed text-zinc-200">${s.narration_chunk}</p>
                        </div>
                      </div>
                    `;
                  }).join("");
                })()}
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === "storyboard") {
        const filteredScenes = selectedActFilter === 0 ? scenes : scenes.filter(s => s.act_number === selectedActFilter);
        v.innerHTML = `
          <div class="space-y-6 max-w-6xl mx-auto">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-xl font-black text-white uppercase tracking-wider font-mono">40-SCENE STORYBOARD</h2>
                <p class="text-xs text-zinc-400 font-mono mt-0.5">Click any scene card to preview its animated MP4 video, 1080p frame, or vector SVG.</p>
              </div>
              <span class="text-xs font-mono text-crimson font-bold">SHOWING ${filteredScenes.length} / ${scenes.length || 40} SCENES</span>
            </div>

            <!-- Act Filter Pills -->
            <div class="flex flex-wrap items-center gap-2 border-b border-surface-800 pb-3">
              <span class="text-xs font-mono text-zinc-500 uppercase">FILTER BY ACT:</span>
              ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(act => `
                <button onclick="selectedActFilter = ${act}; renderView();" class="px-3 py-1 rounded-full text-xs font-mono font-bold transition ${selectedActFilter === act ? 'bg-red-600 text-white glow-red' : 'bg-surface-900 hover:bg-surface-850 text-zinc-400 hover:text-white border border-surface-800'}">
                  ${act === 0 ? 'ALL (40)' : `ACT ${act}`}
                </button>
              `).join('')}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
              ${filteredScenes.map((s, idx) => {
                const scNum = (s.scene_id || idx + 1).toString().padStart(2, "0");
                const originalIdx = (s.scene_id ? s.scene_id - 1 : idx);
                return `
                  <div onclick="openModal(${originalIdx})" class="bg-surface-950 border border-surface-800 hover:border-crimson rounded-xl overflow-hidden cursor-pointer group transition-all">
                    <div class="w-full aspect-video bg-black relative">
                      <img src="/media/${p.date_folder}/${p.topic_slug}/illustrations/scene_${scNum}.png" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                      <div class="absolute top-2 left-2 px-1.5 py-0.5 rounded bg-black/80 text-[9px] font-mono font-bold text-white">
                        #${scNum} (ACT ${s.act_number || 1})
                      </div>
                      <div class="absolute bottom-2 right-2 px-1.5 py-0.5 rounded bg-red-600/90 text-[9px] font-mono text-white font-bold">
                        ${s.duration_sec}s
                      </div>
                      <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                        <div class="w-10 h-10 rounded-full bg-red-600/90 flex items-center justify-center text-white glow-red">
                          <i data-lucide="play" class="w-4 h-4 fill-white ml-0.5"></i>
                        </div>
                      </div>
                    </div>
                    <div class="p-3 space-y-1">
                      <p class="text-xs text-zinc-300 font-sans line-clamp-2">${s.narration_chunk}</p>
                      <div class="text-[10px] font-mono text-crimson pt-1 flex items-center justify-between border-t border-surface-900">
                        <span>${s.camera_movement}</span>
                        <span class="text-zinc-500">PLAY ▶</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      } else if (currentTab === "topics") {
        const filteredTopics = state.topics.filter(t => 
          !topicSearchTerm || 
          t.title.toLowerCase().includes(topicSearchTerm.toLowerCase()) || 
          t.niche.toLowerCase().includes(topicSearchTerm.toLowerCase()) ||
          t.angle.toLowerCase().includes(topicSearchTerm.toLowerCase())
        );
        v.innerHTML = `
          <div class="space-y-6 max-w-5xl mx-auto">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 class="text-xl font-black text-white uppercase tracking-wider font-mono">TOPIC RADAR (20 OPPORTUNITIES)</h2>
                <p class="text-xs text-zinc-400 font-mono mt-0.5">Ranked by audience curiosity and algorithm demand score.</p>
              </div>
              <input type="text" id="topic-search-input" value="${topicSearchTerm}" oninput="topicSearchTerm = this.value; renderView();" placeholder="Filter 20 topics by keyword..." class="w-full sm:w-72 bg-surface-900 border border-surface-800 rounded-lg px-4 py-2 text-xs font-sans text-white focus:outline-none focus:border-red-600" />
            </div>

            <div class="bg-surface-950 border border-surface-800 rounded-xl overflow-hidden">
              <table class="w-full text-left text-xs font-mono">
                <thead class="bg-surface-900 border-b border-surface-800 text-zinc-400">
                  <tr>
                    <th class="py-3 px-4">SCORE</th>
                    <th class="py-3 px-4">TOPIC CONCEPT</th>
                    <th class="py-3 px-4">NICHE</th>
                    <th class="py-3 px-4 text-right">ACTION</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-surface-850">
                  ${filteredTopics.map(t => `
                    <tr class="hover:bg-surface-900/60 transition">
                      <td class="py-3 px-4 text-crimson font-black text-sm">${t.opportunity_score}</td>
                      <td class="py-3 px-4">
                        <span class="text-white font-sans font-bold block">${t.title}</span>
                        <span class="text-[11px] text-zinc-500 line-clamp-1">${t.angle}</span>
                      </td>
                      <td class="py-3 px-4 text-zinc-400">${t.niche}</td>
                      <td class="py-3 px-4 text-right">
                        <button onclick="buildTopic('${t.title.replace(/'/g, "\\'")}')" class="px-3 py-1 rounded bg-red-600 hover:bg-red-500 text-white font-bold text-xs glow-red transition">
                          PRODUCE NOW
                        </button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentTab === "script") {
        v.innerHTML = `
          <div class="space-y-6 max-w-4xl mx-auto">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-xl font-black text-white uppercase tracking-wider font-mono">5-ACT SCRIPT LEDGER</h2>
                <p class="text-xs text-zinc-400 font-mono mt-0.5">Full narrative text calibrated for 12.6-minute documentary delivery.</p>
              </div>
              <button onclick="copyToClipboard(document.getElementById('script-text').innerText, 'Script')" class="px-3 py-1.5 rounded bg-surface-850 hover:bg-surface-800 border border-surface-700 text-xs font-mono text-white">
                COPY SCRIPT
              </button>
            </div>

            <div class="bg-surface-950 border border-surface-800 rounded-xl p-6 space-y-6 font-mono" id="script-text">
              <div>
                <span class="text-xs text-crimson font-bold">TITLE:</span>
                <h3 class="text-xl font-bold text-white mt-1">${script.title || p.topic_title}</h3>
                <p class="text-xs text-zinc-400 mt-1">${script.logline || ""}</p>
              </div>

              <div class="space-y-4">
                ${(script.acts || []).map(act => `
                  <div class="p-4 rounded-xl bg-surface-900 border border-surface-800 space-y-2">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-crimson">ACT ${act.act_number}: ${act.title}</span>
                      <span class="text-[10px] text-zinc-500">~${act.target_duration_sec || 90}s</span>
                    </div>
                    <p class="text-xs text-zinc-300 font-sans leading-relaxed whitespace-pre-wrap">${act.narration_text || act.narration || ""}</p>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      }

      lucide.createIcons();
    }

    // High frequency progress poll (every 750ms) for real-time countdown & micro-meter
    setInterval(pollProgress, 750);

    // Full state poll every 3.5s
    setInterval(pollFull, 3500);

    // Initial startup
    pollProgress();
    pollFull();
  </script>
</body>
</html>
